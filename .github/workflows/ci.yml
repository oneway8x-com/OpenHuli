name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openhuli_test
          POSTGRES_USER: openhuli
          POSTGRES_PASSWORD: openhuli
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U openhuli -d openhuli_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://openhuli:openhuli@127.0.0.1:5432/openhuli_test
      DIRECT_DATABASE_URL: postgresql://openhuli:openhuli@127.0.0.1:5432/openhuli_test
      TEST_DATABASE_URL: postgresql://openhuli:openhuli@127.0.0.1:5432/openhuli_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma:validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm arch:check
      - run: pnpm prompt:check
      - run: pnpm test
      - run: pnpm test:db:setup
      - run: pnpm test:migrations
      - run: pnpm test:int
      - run: pnpm simulate --mock
      - run: docker build -t openhuli-test-mosquitto docker/mosquitto
      - run: pnpm test:broker
        env:
          TEST_MQTT_BROKER_IMAGE: openhuli-test-mosquitto
      - run: pnpm build
      - run: pnpm --filter @corely/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:deployment

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install platformio==6.2.0 esptool==4.11.0
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: firmware-${{ runner.os }}-${{ hashFiles('firmware/esp32-voice/platformio.ini') }}
      - run: pio run --project-dir firmware/esp32-voice --environment s2_mini --environment s2_mini_check
      - name: Test firmware command JSON boundary
        run: |
          binary="$(mktemp)"
          trap 'rm -f "$binary"' EXIT
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/esp32-voice/include \
            -Ifirmware/esp32-voice/.pio/libdeps/s2_mini/ArduinoJson/src \
            firmware/esp32-voice/src/voice_core.cpp firmware/esp32-voice/src/weather_core.cpp \
            firmware/esp32-voice/src/command_json.cpp firmware/esp32-voice/test/command_json.cpp \
            -o "$binary"
          "$binary"
