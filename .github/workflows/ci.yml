name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openhuli_test
          POSTGRES_USER: openhuli
          POSTGRES_PASSWORD: openhuli
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U openhuli -d openhuli_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://openhuli:openhuli@127.0.0.1:5432/openhuli_test
      DIRECT_DATABASE_URL: postgresql://openhuli:openhuli@127.0.0.1:5432/openhuli_test
      TEST_DATABASE_URL: postgresql://openhuli:openhuli@127.0.0.1:5432/openhuli_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma:validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm arch:check
      - run: pnpm prompt:check
      - run: pnpm test
      - run: pnpm test:db:setup
      - run: pnpm test:migrations
      - run: pnpm test:int
      - run: docker build -t openhuli-test-mosquitto docker/mosquitto
      - run: pnpm test:broker
        env:
          TEST_MQTT_BROKER_IMAGE: openhuli-test-mosquitto
      - run: pnpm build
      - run: pnpm --filter @corely/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7
