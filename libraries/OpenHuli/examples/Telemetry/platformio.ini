[platformio]
src_dir = .
default_envs = s2_mini

[env:s2_mini]
platform = espressif32@7.1.3
board = lolin_s2_mini
framework = arduino
platform_packages =
  platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
  platformio/tool-esptoolpy@2.41100.260830
  espressif/toolchain-xtensa-esp32s2@8.4.0+2021r2-patch5
lib_deps =
  OpenHuli=symlink://../..
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:s2_mini_check]
extends = env:s2_mini
build_flags =
  ${env:s2_mini.build_flags}
  -DOPENHULI_LINK_CHECK
