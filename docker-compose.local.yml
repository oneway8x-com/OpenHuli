services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openhuli}
      POSTGRES_USER: ${POSTGRES_USER:-openhuli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openhuli}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openhuli}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mqtt:
    profiles: [mqtt]
    build: ./docker/mosquitto
    restart: unless-stopped
    environment:
      OPENHULI_MQTT_AUTH_URL: http://host.docker.internal:3201
      OPENHULI_MQTT_AUTH_TOKEN: ${RUNTIME_MQTT_AUTH_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:1884:1883"
    volumes:
      - mqtt_data:/mosquitto/data

volumes:
  mqtt_data:
  postgres_data:
