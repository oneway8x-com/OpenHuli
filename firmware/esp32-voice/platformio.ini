[platformio]
default_envs = s2_mini

[env:s2_mini]
platform = espressif32@7.1.3
board = lolin_s2_mini
framework = arduino
platform_packages =
  platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
  platformio/tool-esptoolpy@2.41100.260830
  espressif/toolchain-xtensa-esp32s2@8.4.0+2021r2-patch5
monitor_speed = 115200
lib_deps =
  links2004/WebSockets@2.7.2
  bblanchon/ArduinoJson@6.21.5
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DNODEBUG_WEBSOCKETS
  -DWEBSOCKETS_TCP_TIMEOUT=1000
  -DCORE_DEBUG_LEVEL=0
