[platformio]
src_dir = .

[env:lolin_s2_mini]
platform = espressif32@7.1.3
board = lolin_s2_mini
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
    platformio/tool-esptoolpy@2.41100.260830
    espressif/toolchain-xtensa-esp32s2@8.4.0+2021r2-patch5
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_filter = +<main.cpp>
board_build.embed_txtfiles = certs/root_ca.pem
lib_deps =
    OpenHuli=symlink://../../../libraries/OpenHuli
    arduino-libraries/LiquidCrystal@1.0.7
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    bblanchon/ArduinoJson@6.21.5

[env:lolin_s2_mini_check]
extends = env:lolin_s2_mini
build_flags = ${env:lolin_s2_mini.build_flags} -DOPENHULI_LINK_CHECK
