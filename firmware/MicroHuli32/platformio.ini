[platformio]
default_envs = supermini
src_dir = .

[env:supermini]
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino
platform_packages =
  platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
  platformio/tool-esptoolpy@2.41100.260830
  espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
board_build.flash_mode = dio
board_build.flash_size = 4MB
monitor_speed = 115200
build_src_filter = +<MicroHuli32.ino> +<MicroHuli32.ino.cpp>
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  madhephaestus/ESP32Servo@3.2.1
  https://downloads.arduino.cc/libraries/github.com/olikraus/U8g2-2.36.19.zip
  https://downloads.arduino.cc/libraries/github.com/z3t0/IRremote-4.7.1.zip

[env:supermini_minimal]
extends = env:supermini
build_flags =
  ${env:supermini.build_flags}
  -DMICROHULI_OLED=0
  -DMICROHULI_IR=0
lib_deps = madhephaestus/ESP32Servo@3.2.1
